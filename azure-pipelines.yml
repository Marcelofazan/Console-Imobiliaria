trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  # Busca dinamicamente qualquer arquivo de projeto (.csproj) no repositório para evitar erros de nome
  projectPath: '**/*.csproj'
  buildPlatform: 'AnyCPU'          # Ajustado para AnyCPU conforme o XML do seu projeto
  buildConfiguration: 'Release'

steps:
# 1. Garante a instalação do NuGet no ambiente do agente Windows
- task: NuGetToolInstaller@1
  displayName: 'Garantir Instalador do NuGet'

# 2. Restaura pacotes NuGet se existirem (executa via PowerShell de forma segura)
- powershell: |
    $csproj = Get-Item "$(projectPath)"
    $solutionDir = $csproj.Directory.Parent.FullName
    
    # Executa a restauração apenas se houver referências, forçando a pasta de pacotes na raiz
    nuget restore "$($csproj.FullName)" -PackagesDirectory "$solutionDir\packages"
  displayName: 'Restaurar Pacotes NuGet via PowerShell'

# 3. Compila o Aplicativo Console (.NET Framework) direcionando o resultado para a pasta de staging
- task: VSBuild@1
  displayName: 'Compilar Aplicativo Console'
  inputs:
    solution: '$(projectPath)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: '/p:OutputPath="$(build.artifactStagingDirectory)\ConsolePronto" /p:BaseOutputPath="$(build.artifactStagingDirectory)\ConsolePronto"'
    clean: true

# 4. Compacta os arquivos gerados (Imobiliaria.exe, dependências e App.config) em um único drop.zip
- task: ArchiveFiles@2
  displayName: 'Compactar Arquivos em drop.zip'
  inputs:
    rootFolderOrFile: '$(build.artifactStagingDirectory)\ConsolePronto'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(build.artifactStagingDirectory)\drop.zip'
    replaceExistingArchive: true

# 5. Publica o arquivo drop.zip final na interface do Azure DevOps para download
- task: PublishBuildArtifacts@1
  displayName: 'Publicar Artefato Gerado (drop.zip)'
  inputs:
    PathtoPublish: '$(build.artifactStagingDirectory)\drop.zip'
    ArtifactName: 'drop'
    publishLocation: 'Container'
